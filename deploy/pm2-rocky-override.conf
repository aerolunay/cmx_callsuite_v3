# /etc/systemd/system/pm2-rocky.service.d/override.conf
#
# pm2's generated unit is Type=forking with a PIDFile; systemd never sees the PID
# file and kills pm2 (and the backend) every ~90 s. Treat it as a one-shot that
# "remains" active instead.
#
#   sudo mkdir -p /etc/systemd/system/pm2-rocky.service.d
#   sudo tee /etc/systemd/system/pm2-rocky.service.d/override.conf < this-file
#   sudo systemctl daemon-reload
#   (takes effect at the next restart/reboot of pm2-rocky; no need to restart now)
[Service]
Type=oneshot
RemainAfterExit=yes
